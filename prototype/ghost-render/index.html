<!doctype html>
<html><head><meta charset="utf-8">
<title>Ghost Pet Preview</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font: 13px system-ui, sans-serif; }
  canvas { display: block; }
  body.ui { background: #262a31; }
  body.ui.light { background: #e9e6e1; }
  #bar { position: fixed; left: 8px; right: 8px; bottom: 8px; display: none; gap: 6px; flex-wrap: wrap; justify-content: center; }
  body.ui #bar { display: flex; }
  #bar button { border: 1px solid #555c66; background: #1b1e23; color: #e8ebef; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #bar button.on { border-color: #3fd4ff; }
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<div id="bar"></div>
<script type="module">
// Preview harness. Two modes:
//   index.html?ui=1[&theme=claude]  live animated preview with a state switcher (open in a browser)
//   index.html?ui=clips              live preview of the clawd theme clips
//   index.html                      static page driven by scripts/render-*.mjs through window.api
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildGhost, PART_FILES, CLAUDE_THEME, DEFAULT_THEME } from './src/ghost-model.js';
import { pose as animPose, STATES } from './src/anim.js';
import { CLIPS, VIEW } from './src/theme-clips.js';
import { ringRotationX } from './src/pose-map.js';
import { makeEnergySphere, makeBurst, makeScan } from './src/effects.js';

const q = new URLSearchParams(location.search);
const live = q.has('ui');
const W = live ? innerWidth : +(q.get('w') || 600), H = live ? innerHeight : +(q.get('h') || 600);
const THEMES = { classic: undefined, claude: CLAUDE_THEME };

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: !live });
renderer.setPixelRatio(live ? devicePixelRatio : 1); renderer.setSize(W, H); renderer.setClearColor(0, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(160, 220, 260); scene.add(key);
const rim = new THREE.DirectionalLight(0xa9c8ff, 1.6); rim.position.set(-260, 80, -220); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xe8eeff, 0x2a2d33, 0.5));
const camera = new THREE.PerspectiveCamera(28, W / H, 1, 3000);

const loader = new STLLoader();
const geoms = Object.fromEntries(await Promise.all(PART_FILES.map(n => new Promise((res, rej) =>
  loader.load(`./stl/${n}.stl`, g => { g.computeVertexNormals(); res([n, g]); }, undefined,
    () => rej(new Error(`missing stl/${n}.stl — unzip the Ghost kit into ./stl (see README)`)))))));

let theme = THEMES[q.get('theme') || 'classic'];
let ghost;
const sphere = makeEnergySphere(), burst = makeBurst(), scan = makeScan();
scene.add(burst.group);
function mountGhost() {
  if (ghost) scene.remove(ghost.root);
  ghost = buildGhost(geoms, { theme });
  ghost.root.add(sphere.mesh, sphere.radiance);   // follow hover and turn with the Ghost
  ghost.core.add(scan.mesh);            // model frame: sweeps with the eye
  scene.add(ghost.root);
}
mountGhost();
let zoom = 1;
// Backgrounds: 'transparent' for previews, 'black' / 'white' for the matted theme frames.
function setBackground(bg) {
  if (bg === 'black') renderer.setClearColor(0x000000, 1);
  else if (bg === 'white') renderer.setClearColor(0xffffff, 1);
  else renderer.setClearColor(0, 0);
}

const rad = THREE.MathUtils.degToRad;
window.__ghost = () => ghost;   // diagnostics only (scripts/check-direction.mjs)
window.api = {
  setTheme(th) {
    theme = typeof th === 'string' ? THEMES[th] : th;
    mountGhost();
  },
  setBackground,
  view(az, el, dist = 360) {
    const d = dist * zoom;
    camera.position.set(d * Math.cos(rad(el)) * Math.sin(rad(az)), d * Math.sin(rad(el)), d * Math.cos(rad(el)) * Math.cos(rad(az)));
    camera.lookAt(0, 0, 0); renderer.render(scene, camera);
  },
  anim(state, t) { this.pose(animPose(state, t, (theme ?? DEFAULT_THEME).eye ?? DEFAULT_THEME.eye)); },
  // clawd theme clips (src/theme-clips.js), always framed by the shared VIEW camera
  clipList() { return CLIPS.map(({ id, fps, duration, loop }) => ({ id, fps, duration, loop })); },
  clip(id, t, bg) {
    const clip = CLIPS.find(c => c.id === id);
    if (!clip) throw new Error(`unknown clip ${id}`);
    if (bg) setBackground(bg);
    this.pose(clip.pose(t));
    this.view(VIEW.azimuth, VIEW.elevation, VIEW.distance);
  },
  // see src/theme-clips.js for what each field means
  pose(p = {}) {
    const { open = 0, eye, eyeIntensity = 1, yaw = 0, pitch = 0, roll = 0, hover = 0 } = p;
    ghost.setCorners(open, p.tumble);
    const r = ringRotationX(p);                          // front clockwise, back counter-clockwise
    ghost.rings.front.rotation.x = r.front;
    ghost.rings.back.rotation.x = r.back;
    if (eye !== undefined) ghost.setEyeColor(eye, eyeIntensity);
    ghost.setCoreGlow(p.core ?? 0.4, eye);
    ghost.root.rotation.set(rad(pitch), rad(yaw), rad(roll));
    ghost.root.position.y = hover;
    sphere.set(p.sphere);
    scan.set(p.scan);
    burst.group.position.set(0, hover, 0);
    zoom = p.zoom ?? 1;
    burst.set(p.burst);
  },
};

if (live) {
  document.body.classList.add('ui');
  if (q.get('bg') === 'light') document.body.classList.add('light');
  let state = 'idle', since = performance.now();
  const bar = document.getElementById('bar');
  const names = q.get('ui') === 'clips' ? CLIPS.map(c => c.id) : STATES;
  const play = q.get('ui') === 'clips'
    ? (s, t) => { const c = CLIPS.find(x => x.id === s); window.api.clip(s, c.loop ? t % c.duration : Math.min(t, c.duration)); }
    : (s, t) => { window.api.anim(s, t); window.api.view(0, 4, 400); };
  for (const s of names) {
    const b = document.createElement('button'); b.textContent = s; b.dataset.s = s;
    b.onclick = () => { state = s; since = performance.now(); [...bar.children].forEach(x => x.classList.toggle('on', x.dataset.s === s)); };
    bar.appendChild(b);
  }
  bar.firstChild.classList.add('on');
  state = names[0];
  const frame = (now) => { play(state, (now - since) / 1000); requestAnimationFrame(frame); };
  requestAnimationFrame(frame);
} else {
  window.api.view(30, 12);
}
window.ready = true;
</script>
</body></html>
